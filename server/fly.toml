# fly.toml app configuration file generated for govtapp on 2026-10-30T14:05:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'govtapp'
primary_region = 'sin'

[build]

[deploy]
  release_command = 'npx prisma db push'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
